<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9700 Biology AS Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f0d;
    --surface: #111a15;
    --surface2: #162019;
    --border: #1e3024;
    --accent: #3dffa0;
    --accent2: #1aff80;
    --accent-dim: rgba(61,255,160,0.12);
    --accent-glow: rgba(61,255,160,0.25);
    --text: #e8f5ee;
    --text-muted: #6a9478;
    --text-dim: #3a5e46;
    --card-front: #111a15;
    --card-back: #0d1f15;
    --danger: #ff6b6b;
    --warning: #ffd166;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content:'';
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(61,255,160,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(61,255,160,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events:none; z-index:0;
  }

  /* Glow orb */
  body::after {
    content:'';
    position:fixed;
    width:600px; height:600px;
    top:-200px; right:-200px;
    background: radial-gradient(circle, rgba(61,255,160,0.06) 0%, transparent 70%);
    pointer-events:none; z-index:0;
  }

  .app { position:relative; z-index:1; }

  /* HEADER */
  header {
    padding: 24px 40px;
    border-bottom: 1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    backdrop-filter: blur(10px);
    position: sticky; top:0; z-index:100;
    background: rgba(10,15,13,0.85);
  }

  .logo {
    display:flex; align-items:center; gap:12px;
  }

  .logo-icon {
    width:36px; height:36px;
    background: var(--accent);
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
  }

  .logo-text {
    font-family: 'Playfair Display', serif;
    font-size:20px;
    letter-spacing:-0.5px;
  }

  .logo-sub {
    font-size:11px;
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-top:2px;
  }

  .header-stats {
    display:flex; gap:24px;
  }

  .stat-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius:8px;
    padding: 6px 14px;
    font-family:'DM Mono', monospace;
    font-size:12px;
    color: var(--text-muted);
  }

  .stat-chip span {
    color: var(--accent);
    font-weight:500;
  }

  /* MAIN LAYOUT */
  .main {
    display:grid;
    grid-template-columns: 260px 1fr;
    min-height: calc(100vh - 73px);
  }

  /* SIDEBAR */
  .sidebar {
    border-right: 1px solid var(--border);
    padding: 24px 0;
    overflow-y: auto;
    background: var(--surface);
  }

  .sidebar-label {
    font-family:'DM Mono', monospace;
    font-size:10px;
    letter-spacing:3px;
    color: var(--text-dim);
    text-transform:uppercase;
    padding: 0 20px 10px;
  }

  .topic-btn {
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding: 10px 20px;
    cursor:pointer;
    display:flex; align-items:center; gap:10px;
    color: var(--text-muted);
    font-family:'DM Sans', sans-serif;
    font-size:13px;
    transition: all 0.15s;
    border-left: 2px solid transparent;
    position:relative;
  }

  .topic-btn:hover {
    color: var(--text);
    background: var(--accent-dim);
    border-left-color: var(--accent);
  }

  .topic-btn.active {
    color: var(--accent);
    background: var(--accent-dim);
    border-left-color: var(--accent);
    font-weight:500;
  }

  .topic-num {
    font-family:'DM Mono', monospace;
    font-size:10px;
    color: var(--text-dim);
    min-width:20px;
  }

  .topic-count {
    margin-left:auto;
    background: var(--surface2);
    border-radius:4px;
    padding:2px 6px;
    font-family:'DM Mono', monospace;
    font-size:10px;
    color: var(--text-dim);
  }

  .topic-btn.active .topic-count {
    background: rgba(61,255,160,0.15);
    color: var(--accent);
  }

  /* CONTENT */
  .content {
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 40px 20px;
    gap:32px;
  }

  /* Topic header */
  .topic-header {
    text-align:center;
    max-width:700px;
  }

  .topic-tag {
    font-family:'DM Mono', monospace;
    font-size:11px;
    letter-spacing:3px;
    color: var(--accent);
    text-transform:uppercase;
    margin-bottom:8px;
  }

  .topic-title {
    font-family:'Playfair Display', serif;
    font-size:32px;
    font-weight:600;
    letter-spacing:-1px;
    line-height:1.1;
  }

  /* Progress bar */
  .progress-wrap {
    width:100%;
    max-width:700px;
  }

  .progress-info {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:8px;
  }

  .progress-label {
    font-family:'DM Mono', monospace;
    font-size:11px;
    color: var(--text-muted);
  }

  .progress-frac {
    font-family:'DM Mono', monospace;
    font-size:12px;
    color: var(--accent);
  }

  .progress-track {
    height:3px;
    background: var(--border);
    border-radius:2px;
    overflow:hidden;
  }

  .progress-fill {
    height:100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius:2px;
    transition: width 0.4s ease;
  }

  /* FLASHCARD */
  .card-area {
    perspective: 1200px;
    width:100%;
    max-width:700px;
    height:380px;
    cursor:pointer;
  }

  .card-inner {
    width:100%; height:100%;
    position:relative;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .card-inner.flipped {
    transform: rotateY(180deg);
  }

  .card-face {
    position:absolute; inset:0;
    backface-visibility: hidden;
    border-radius:20px;
    padding: 48px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .card-front {
    background: var(--card-front);
  }

  .card-back {
    background: var(--card-back);
    transform: rotateY(180deg);
    border-color: rgba(61,255,160,0.2);
  }

  /* Card decorative elements */
  .card-face::before {
    content:'';
    position:absolute;
    top:-40px; right:-40px;
    width:180px; height:180px;
    border-radius:50%;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
    pointer-events:none;
  }

  .card-back::before {
    background: radial-gradient(circle, rgba(61,255,160,0.18) 0%, transparent 70%);
  }

  .card-label {
    font-family:'DM Mono', monospace;
    font-size:10px;
    letter-spacing:3px;
    text-transform:uppercase;
    color: var(--text-dim);
    margin-bottom:20px;
    position:relative;
  }

  .card-front .card-label::after {
    content: '↕ TAP TO FLIP';
    display:block;
    margin-top:4px;
    font-size:9px;
    color: var(--text-dim);
    opacity:0.6;
  }

  .card-back .card-label {
    color: rgba(61,255,160,0.5);
  }

  .card-question {
    font-family:'Playfair Display', serif;
    font-size:22px;
    font-weight:600;
    line-height:1.4;
    color: var(--text);
    max-width:560px;
    position:relative;
  }

  .card-answer {
    font-size:15px;
    line-height:1.7;
    color: var(--text);
    max-width:560px;
    position:relative;
    font-weight:300;
  }

  .card-answer strong {
    color: var(--accent);
    font-weight:600;
  }

  .card-corner {
    position:absolute;
    bottom:20px; right:24px;
    font-family:'DM Mono', monospace;
    font-size:10px;
    color: var(--text-dim);
  }

  /* CONTROLS */
  .controls {
    display:flex; gap:12px; align-items:center;
  }

  .btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 28px;
    border-radius:10px;
    font-family:'DM Sans', sans-serif;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    transition: all 0.15s;
    display:flex; align-items:center; gap:8px;
  }

  .btn:hover {
    background: var(--surface2);
    border-color: var(--text-dim);
  }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #0a0f0d;
    font-weight:600;
  }

  .btn-primary:hover {
    background: var(--accent2);
    border-color: var(--accent2);
  }

  .btn-icon {
    width:44px; height:44px;
    padding:0;
    border-radius:10px;
    justify-content:center;
    font-size:18px;
  }

  .btn:disabled {
    opacity:0.3;
    cursor:not-allowed;
  }

  /* SCORE BUTTONS */
  .score-row {
    display:flex; gap:10px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.3s;
  }

  .score-row.visible {
    opacity:1;
    pointer-events:all;
  }

  .score-btn {
    padding: 10px 20px;
    border-radius:8px;
    font-size:13px;
    font-family:'DM Mono', monospace;
    cursor:pointer;
    border: 1px solid;
    transition: all 0.15s;
    font-weight:500;
  }

  .score-easy {
    background: rgba(61,255,160,0.1);
    border-color: rgba(61,255,160,0.3);
    color: var(--accent);
  }
  .score-easy:hover { background: rgba(61,255,160,0.2); }

  .score-medium {
    background: rgba(255,209,102,0.1);
    border-color: rgba(255,209,102,0.3);
    color: var(--warning);
  }
  .score-medium:hover { background: rgba(255,209,102,0.2); }

  .score-hard {
    background: rgba(255,107,107,0.1);
    border-color: rgba(255,107,107,0.3);
    color: var(--danger);
  }
  .score-hard:hover { background: rgba(255,107,107,0.2); }

  /* Shuffle button */
  .btn-shuffle {
    letter-spacing:0.5px;
  }

  /* Keyboard hint */
  .key-hint {
    font-family:'DM Mono', monospace;
    font-size:11px;
    color: var(--text-dim);
    display:flex; gap:12px;
  }

  .key {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius:4px;
    padding:2px 7px;
    font-size:11px;
  }

  /* All done state */
  .done-state {
    display:none;
    text-align:center;
    padding:60px 40px;
    max-width:500px;
  }

  .done-state.visible { display:block; }
  .card-area.done { display:none; }

  .done-icon {
    font-size:64px;
    margin-bottom:20px;
  }

  .done-title {
    font-family:'Playfair Display', serif;
    font-size:28px;
    margin-bottom:12px;
  }

  .done-sub {
    color: var(--text-muted);
    font-size:14px;
    margin-bottom:28px;
    line-height:1.6;
  }

  .score-summary {
    display:flex; gap:16px; justify-content:center; margin-bottom:28px;
  }

  .score-pill {
    padding:8px 16px;
    border-radius:8px;
    font-family:'DM Mono', monospace;
    font-size:12px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius:2px; }

  @media (max-width: 768px) {
    .main { grid-template-columns: 1fr; }
    .sidebar { border-right:none; border-bottom: 1px solid var(--border); padding:12px 0; }
    .topic-btn { padding: 8px 16px; }
    header { padding:16px 20px; }
    .header-stats { display:none; }
    .card-area { height:320px; }
    .card-face { padding:32px 24px; }
    .card-question { font-size:18px; }
  }
</style>
</head>
<body>
<div class="app">

<header>
  <div class="logo">
    <div class="logo-icon">🧬</div>
    <div>
      <div class="logo-text">BioCards</div>
      <div class="logo-sub">9700 AS Level</div>
    </div>
  </div>
  <div class="header-stats">
    <div class="stat-chip">Cards studied: <span id="studiedCount">0</span></div>
    <div class="stat-chip">Easy: <span id="easyCount">0</span> &nbsp;Med: <span id="medCount">0</span> &nbsp;Hard: <span id="hardCount">0</span></div>
  </div>
</header>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-label">Topics</div>
    <div id="topicList"></div>
  </div>

  <div class="content">
    <div class="topic-header">
      <div class="topic-tag" id="topicTag">Chapter 1</div>
      <div class="topic-title" id="topicTitle">Cell Structure</div>
    </div>

    <div class="progress-wrap">
      <div class="progress-info">
        <span class="progress-label">PROGRESS</span>
        <span class="progress-frac" id="progressFrac">1 / 10</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>

    <div class="card-area" id="cardArea" onclick="flipCard()">
      <div class="card-inner" id="cardInner">
        <div class="card-face card-front">
          <div class="card-label">Question</div>
          <div class="card-question" id="cardQuestion">Loading...</div>
          <div class="card-corner" id="cardCorner">1 / 1</div>
        </div>
        <div class="card-face card-back">
          <div class="card-label">Answer</div>
          <div class="card-answer" id="cardAnswer">Loading...</div>
        </div>
      </div>
    </div>

    <div class="done-state" id="doneState">
      <div class="done-icon">✅</div>
      <div class="done-title">Topic Complete!</div>
      <div class="done-sub">You've reviewed all cards in this topic.<br>Check your scores below.</div>
      <div class="score-summary">
        <div class="score-pill score-easy">😌 Easy: <span id="doneEasy">0</span></div>
        <div class="score-pill score-medium">🤔 Medium: <span id="doneMed">0</span></div>
        <div class="score-pill score-hard">😰 Hard: <span id="doneHard">0</span></div>
      </div>
      <button class="btn btn-primary" onclick="restartTopic()">↺ Restart Topic</button>
    </div>

    <div class="score-row" id="scoreRow">
      <button class="score-btn score-easy" onclick="markCard('easy')">😌 Easy</button>
      <button class="score-btn score-medium" onclick="markCard('medium')">🤔 Medium</button>
      <button class="score-btn score-hard" onclick="markCard('hard')">😰 Hard</button>
    </div>

    <div class="controls">
      <button class="btn btn-icon" id="prevBtn" onclick="prevCard()" title="Previous">←</button>
      <button class="btn btn-primary" onclick="nextCard()" id="nextBtn">Next →</button>
      <button class="btn btn-icon btn-shuffle" onclick="shuffleCards()" title="Shuffle">⇄</button>
    </div>

    <div class="key-hint">
      <span><span class="key">Space</span> Flip</span>
      <span><span class="key">→</span> Next</span>
      <span><span class="key">←</span> Prev</span>
    </div>
  </div>
</div>

</div>

<script>
const TOPICS = [
  {
    id: 1,
    name: "Cell Structure",
    tag: "Chapter 1",
    cards: [
      { q: "What is the function of the rough endoplasmic reticulum (RER)?", a: "The <strong>RER</strong> synthesises and transports <strong>proteins</strong>. Ribosomes on its surface translate mRNA, and the protein is threaded into the lumen for modification and transport to the Golgi apparatus." },
      { q: "How does the smooth ER differ from the rough ER?", a: "The <strong>smooth ER</strong> lacks ribosomes and is involved in <strong>lipid and steroid synthesis</strong> and detoxification. The rough ER bears ribosomes and is involved in <strong>protein synthesis and transport</strong>." },
      { q: "What is the role of the Golgi apparatus?", a: "The Golgi apparatus <strong>modifies, packages and sorts</strong> proteins and lipids received from the ER into vesicles. It adds carbohydrates to form glycoproteins and glycolipids, and directs products to their destinations." },
      { q: "What are the key differences between prokaryotic and eukaryotic cells?", a: "<strong>Prokaryotes</strong>: no membrane-bound nucleus, no membrane-bound organelles, 70S ribosomes, circular DNA, smaller (1–10 µm).<br><strong>Eukaryotes</strong>: true nucleus, membrane-bound organelles, 80S ribosomes, linear DNA, larger (10–100 µm)." },
      { q: "Describe the structure of a mitochondrion.", a: "Mitochondria have a <strong>double membrane</strong>: outer membrane (smooth) and inner membrane (folded into <strong>cristae</strong>). The matrix contains enzymes for the Krebs cycle, mitochondrial DNA, and 70S ribosomes. The <strong>cristae</strong> increase surface area for ATP synthesis." },
      { q: "What is the role of lysosomes?", a: "Lysosomes contain <strong>hydrolytic enzymes</strong> (hydrolases) that digest worn-out organelles (<strong>autophagy</strong>), foreign material (<strong>phagocytosis</strong>), and cellular debris. They maintain an acidic interior (pH ~4.5)." },
      { q: "What is the 9+2 arrangement in a cilium?", a: "Cilia contain <strong>9 peripheral pairs</strong> of microtubule doublets surrounding <strong>1 central pair</strong> — a total of 11 microtubule pairs. Motor protein <strong>dynein</strong> causes sliding between doublets, producing the beating motion." },
      { q: "What is the difference between resolution and magnification?", a: "<strong>Magnification</strong> = how much larger an image is than the actual specimen. <strong>Resolution</strong> = the ability to distinguish two adjacent points as separate. Higher resolution means finer detail is visible. Electron microscopes have greater resolution than light microscopes (~0.1 nm vs ~200 nm)." },
      { q: "State the formula used in microscopy calculations.", a: "<strong>Magnification = Image size ÷ Actual size</strong><br>Rearranged: Actual size = Image size ÷ Magnification<br>Always convert units carefully (µm ↔ mm: 1 mm = 1000 µm)." },
      { q: "What are the advantages of the electron microscope over the light microscope?", a: "<strong>Electron microscope</strong> advantages: much higher <strong>resolution</strong> (~0.1 nm), can reveal ultrastructure (e.g. ribosomes, cristae). Disadvantages: specimens must be dead, complex preparation, very expensive. <strong>Light microscope</strong>: can view living specimens, simpler, cheaper." },
    ]
  },
  {
    id: 2,
    name: "Biological Molecules",
    tag: "Chapter 2",
    cards: [
      { q: "What are the monomers of carbohydrates, proteins and nucleic acids?", a: "<strong>Carbohydrates</strong>: monosaccharides (e.g. glucose)<br><strong>Proteins</strong>: amino acids<br><strong>Nucleic acids</strong>: nucleotides<br>These are linked by condensation reactions to form polymers." },
      { q: "Describe the structure of glucose and distinguish α from β glucose.", a: "Glucose (C₆H₁₂O₆) is a hexose monosaccharide. <strong>α-glucose</strong>: –OH on C1 is below the ring. <strong>β-glucose</strong>: –OH on C1 is above the ring. This difference determines which polymer forms (starch vs cellulose)." },
      { q: "How is a glycosidic bond formed?", a: "A <strong>condensation reaction</strong> between two monosaccharides eliminates a <strong>water molecule</strong>, forming a <strong>glycosidic bond</strong>. The bond links C1 of one sugar to C4 of another (1,4-glycosidic bond) or C1 to C6 (1,6-glycosidic bond, causing branching)." },
      { q: "Compare the structures of starch and cellulose.", a: "<strong>Starch</strong>: made of <strong>α-glucose</strong>; amylose is unbranched (1,4 bonds), amylopectin is branched (1,4 and 1,6 bonds); coiled, compact, good for storage.<br><strong>Cellulose</strong>: made of <strong>β-glucose</strong>; straight, unbranched chains; alternate glucose units flipped 180°; cross-linked by H-bonds forming microfibrils; rigid, structural role in cell walls." },
      { q: "What is the primary structure of a protein?", a: "The <strong>primary structure</strong> is the linear sequence of <strong>amino acids</strong> joined by peptide bonds. It is determined by the gene and determines all higher levels of structure and ultimately the protein's function." },
      { q: "Describe secondary, tertiary and quaternary protein structure.", a: "<strong>Secondary</strong>: regular folding due to H-bonds between –CO and –NH groups → α-helix or β-pleated sheet.<br><strong>Tertiary</strong>: overall 3D shape; ionic bonds, H-bonds, disulfide bridges, hydrophobic interactions.<br><strong>Quaternary</strong>: multiple polypeptide subunits (e.g. haemoglobin: 4 subunits)." },
      { q: "What is a phospholipid and how does its structure relate to its role in membranes?", a: "A <strong>phospholipid</strong> has a <strong>glycerol</strong> backbone, two fatty acid tails (hydrophobic) and a phosphate group (hydrophilic head). This <strong>amphipathic</strong> nature causes phospholipids to form a <strong>bilayer</strong> in water — tails inward, heads outward — forming the basis of cell membranes." },
      { q: "What is the Benedict's test and what does a positive result indicate?", a: "<strong>Benedict's test</strong> detects reducing sugars. Add Benedict's reagent, heat in water bath. <strong>Positive</strong>: blue → green → yellow → orange → brick red precipitate, indicating the presence of a reducing sugar (e.g. glucose, maltose). Non-reducing sugars (e.g. sucrose) require acid hydrolysis first." },
      { q: "How do you test for starch, protein, and lipids?", a: "<strong>Starch</strong>: add iodine in KI solution → blue-black colour.<br><strong>Protein (Biuret)</strong>: add NaOH then CuSO₄ → <strong>purple/violet</strong> colour (peptide bonds).<br><strong>Lipid (Emulsion)</strong>: dissolve in ethanol, add to water → <strong>milky/cloudy emulsion</strong>." },
      { q: "What properties of water make it important in biology?", a: "<strong>Cohesion</strong>: H-bonds cause water molecules to stick together (transpiration stream).<br><strong>High specific heat capacity</strong>: resists temperature change (habitat stability).<br><strong>High latent heat of vaporisation</strong>: evaporation is cooling.<br><strong>Solvent</strong>: polar molecule dissolves ionic/polar substances.<br><strong>Metabolite</strong>: used in hydrolysis and condensation reactions." },
    ]
  },
  {
    id: 3,
    name: "Enzymes",
    tag: "Chapter 3",
    cards: [
      { q: "What is an enzyme and how does it work according to the induced fit model?", a: "Enzymes are <strong>biological catalysts</strong> (globular proteins) that lower activation energy. In the <strong>induced fit model</strong>, the active site changes shape slightly when the substrate binds, forming a precise enzyme-substrate complex that stresses bonds in the substrate, promoting the reaction." },
      { q: "What is the difference between competitive and non-competitive inhibition?", a: "<strong>Competitive inhibition</strong>: inhibitor has similar shape to substrate, binds to active site. Adding more substrate can overcome it. Vmax unchanged, Km increases.<br><strong>Non-competitive inhibition</strong>: inhibitor binds to an <strong>allosteric site</strong>, changes active site shape. Cannot be overcome by more substrate. Vmax decreases, Km unchanged." },
      { q: "How does temperature affect enzyme activity?", a: "As temperature increases, kinetic energy increases → more frequent collisions → rate increases up to the <strong>optimum temperature</strong>. Above optimum, <strong>H-bonds and other bonds holding the tertiary structure break</strong> → enzyme <strong>denatures</strong> → active site changes shape irreversibly → rate falls to zero." },
      { q: "How does pH affect enzyme activity?", a: "Changes in pH alter the <strong>ionisation of R-groups</strong> in the active site. This disrupts <strong>ionic bonds and H-bonds</strong>, changing the active site's shape. Extreme pH values cause denaturation. Each enzyme has an <strong>optimum pH</strong> (e.g. pepsin ~2, amylase ~7)." },
      { q: "What is the effect of substrate concentration on enzyme activity?", a: "As substrate concentration increases, rate increases (more enzyme-substrate collisions) until all active sites are occupied → enzyme is <strong>saturated</strong> → rate plateaus at <strong>Vmax</strong>. The <strong>Km</strong> is the substrate concentration at half Vmax and is a measure of enzyme-substrate affinity." },
      { q: "What is meant by enzyme specificity?", a: "Each enzyme has a uniquely shaped <strong>active site</strong> complementary only to its specific substrate(s). This is due to the precise tertiary structure of the enzyme. Only the correct substrate can form an enzyme-substrate complex and undergo catalysis." },
      { q: "What is an end-product inhibitor? Give an example.", a: "<strong>End-product (feedback) inhibition</strong>: the final product of a metabolic pathway acts as a non-competitive inhibitor of an enzyme earlier in the pathway, preventing overproduction. E.g. in amino acid synthesis, the end amino acid inhibits the first enzyme in its synthesis pathway." },
      { q: "What is coenzyme and prosthetic group?", a: "A <strong>coenzyme</strong> is an organic, non-protein cofactor that temporarily binds to the enzyme (e.g. NAD⁺). A <strong>prosthetic group</strong> is a cofactor permanently attached to the enzyme (e.g. the haem group in catalase). Both are required for enzyme activity." },

  loadTopic(0);
}

function buildTopicList() {
  const list = document.getElementById('topicList');
  TOPICS.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'topic-btn' + (i === 0 ? ' active' : '');
    btn.innerHTML = `<span class="topic-num">${String(t.id).padStart(2,'0')}</span>${t.name}<span class="topic-count">${t.cards.length}</span>`;
    btn.onclick = () => { loadTopic(i); };
    list.appendChild(btn);
  });
}

function loadTopic(idx) {
  currentTopic = idx;
  currentCard = 0;
  isFlipped = false;
  cards = [...TOPICS[idx].cards];
  scores = { easy:0, medium:0, hard:0 };

  // Update sidebar
  document.querySelectorAll('.topic-btn').forEach((b,i) => {
    b.classList.toggle('active', i === idx);
  });

  document.getElementById('topicTag').textContent = TOPICS[idx].tag;
  document.getElementById('topicTitle').textContent = TOPICS[idx].name;

  document.getElementById('doneState').classList.remove('visible');
  document.getElementById('cardArea').style.display = '';

  showCard();
  updateProgress();
  hideScoreRow();
}

function showCard() {
  const card = cards[currentCard];
  document.getElementById('cardQuestion').innerHTML = card.q;
  document.getElementById('cardAnswer').innerHTML = card.a;
  document.getElementById('cardCorner').textContent = `${currentCard + 1} / ${cards.length}`;

  // Reset flip
  const inner = document.getElementById('cardInner');
  inner.classList.remove('flipped');
  isFlipped = false;
  hideScoreRow();
}

function flipCard() {
  const inner = document.getElementById('cardInner');
  isFlipped = !isFlipped;
  inner.classList.toggle('flipped', isFlipped);
  if (isFlipped) showScoreRow();
  else hideScoreRow();
}

function showScoreRow() {
  document.getElementById('scoreRow').classList.add('visible');
}

function hideScoreRow() {
  document.getElementById('scoreRow').classList.remove('visible');
}

function nextCard() {
  if (currentCard < cards.length - 1) {
    currentCard++;
    showCard();
    updateProgress();
  } else {
    showDone();
  }
}

function prevCard() {
  if (currentCard > 0) {
    currentCard--;
    showCard();
    updateProgress();
  }
}

function markCard(level) {
  scores[level]++;
  totalStudied++;
  updateHeaderStats();
  nextCard();
}

function updateProgress() {
  const pct = ((currentCard) / cards.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressFrac').textContent = `${currentCard + 1} / ${cards.length}`;
  document.getElementById('prevBtn').disabled = currentCard === 0;
}

function updateHeaderStats() {
  document.getElementById('studiedCount').textContent = totalStudied;
  document.getElementById('easyCount').textContent = scores.easy;
  document.getElementById('medCount').textContent = scores.medium;
  document.getElementById('hardCount').textContent = scores.hard;
}

function showDone() {
  document.getElementById('cardArea').style.display = 'none';
  document.getElementById('doneState').classList.add('visible');
  document.getElementById('doneEasy').textContent = scores.easy;
  document.getElementById('doneMed').textContent = scores.medium;
  document.getElementById('doneHard').textContent = scores.hard;
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressFrac').textContent = `${cards.length} / ${cards.length}`;
  hideScoreRow();
}

function restartTopic() {
  loadTopic(currentTopic);
}

function shuffleCards() {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  currentCard = 0;
  scores = { easy:0, medium:0, hard:0 };
  showCard();
  updateProgress();
}

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
  if (e.key === 'ArrowRight') nextCard();
  if (e.key === 'ArrowLeft') prevCard();
  if (e.key === '1') markCard('easy');
  if (e.key === '2') markCard('medium');
  if (e.key === '3') markCard('hard');
});

init();
</script>
</body>
</html>
